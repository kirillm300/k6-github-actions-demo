name: Performance Regression Testing

# Триггер: запускаем воркфлоу при каждом push или Pull Request в ветку main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  k6_test:
    name: Run k6 Load Test
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория в контейнер
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Запускаем k6 с помощью официального Action от разработчиков k6
      - name: Run k6 local test
        uses: grafana/k6-action@v1
        with:
          filename: test.js
